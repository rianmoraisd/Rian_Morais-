server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Arquivos internos do repositório não devem ser acessíveis pelo navegador
    location ~ /\. {
        deny all;
    }

    location ^~ /BACK_END/ {
        deny all;
    }

    location ~* \.md$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
