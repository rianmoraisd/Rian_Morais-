<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AtendeAI | Criar empresa</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="auth-page">


<div class="auth-card">

    <a href="index.html" class="logo">
        <span>✦</span> AtendeAI
    </a>


    <h1>
        Criar sua empresa
    </h1>

    <p>
        Comece agora a utilizar a AtendeAI.
    </p>


    <form id="cadastroForm">


        <label>
            Nome da empresa

            <input
                type="text"
                placeholder="Minha Empresa"
                required
            >

        </label>


        <label>
            Seu nome

            <input
                type="text"
                placeholder="Seu nome"
                required
            >

        </label>


        <label>
            E-mail

            <input
                type="email"
                placeholder="voce@empresa.com"
                required
            >

        </label>


        <label>
            Telefone

            <input
                type="tel"
                placeholder="(62) 99999-9999"
            >

        </label>


        <label>
            Cidade

            <input
                type="text"
                placeholder="Goiânia"
            >

        </label>


        <label>
            Segmento

            <select>

                <option value="">
                    Escolha o segmento
                </option>

                <option>
                    Barbearia
                </option>

                <option>
                    Salão de beleza
                </option>

                <option>
                    Restaurante
                </option>

                <option>
                    Loja
                </option>

                <option>
                    Clínica
                </option>

                <option>
                    Oficina
                </option>

                <option>
                    Outro
                </option>

            </select>

        </label>


        <label>
            Senha

            <input
                type="password"
                placeholder="••••••••"
                required
            >

        </label>


        <label>
            Confirmar senha

            <input
                type="password"
                placeholder="••••••••"
                required
            >

        </label>


        <button
            type="submit"
            class="button primary full"
        >
            Criar minha conta
        </button>

    </form>


    <p class="register-text">

        Já possui uma conta?

        <a href="login.html">
            Entrar
        </a>

    </p>


    <a href="index.html" class="back-site">
        ← Voltar para o site
    </a>

</div>


</body>
</html>
