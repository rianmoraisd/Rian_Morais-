# Base44 dev environment — static HTML/CSS/JS site (no build step, no backend).
# nginx serves the repo root straight from the bind mount, so edits on disk are
# picked up on the next browser refresh.
services:
  web:
    image: nginx:alpine
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./.base44/nginx.conf:/etc/nginx/nginx.conf:ro
    labels:
      base44.project: "AtendeAI"
      base44.kind: "web"
      base44.port: "3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
