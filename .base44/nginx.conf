# Development main config for the static site.
# Workers intentionally run as root: the repo is bind-mounted from a 0700 root-owned
# checkout, so an unprivileged worker cannot traverse it in the sandbox.
user root;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;

    server {
        listen 3000;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Development: always serve the files currently on disk.
        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-store";
        }
    }
}
